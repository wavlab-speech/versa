name: VERSA CI
on:
  push:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  docstring-coverage:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'

    - name: Install static documentation checkers
      run: python -m pip install -r ci/requirements-docstrings.txt

    - name: Interrogate package docstrings
      run: interrogate --verbose --verbose --fail-under 80 versa

    - name: Cross-check package docstrings
      if: ${{ !cancelled() }}
      run: docstr-coverage --include-setter --include-deleter --fail-under 80 versa

    - name: Check function-only docstrings
      if: ${{ !cancelled() }}
      run: python ci/check_function_docstrings.py --fail-under 80 versa

  code-quality:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Match the formatter revision in .pre-commit-config.yaml.
        pip install -e .[dev] black==25.1.0
        
    - name: Check formatting
      run: |
        git ls-files '*.py' | xargs black --check
      
    - name: Lint with flake8
      run: |
        flake8 versa scripts test ci setup.py --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 versa scripts test ci setup.py --count --exit-zero --max-line-length=127 --statistics

  install-tests:
    needs: code-quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']
    
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
        
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip wheel --no-deps --wheel-dir dist .
        python -m venv "$RUNNER_TEMP/versa-wheel-env"
        "$RUNNER_TEMP/versa-wheel-env/bin/python" -m pip install --upgrade pip
        "$RUNNER_TEMP/versa-wheel-env/bin/python" -m pip install dist/*.whl

    - name: Test the installed wheel outside the checkout
      working-directory: ${{ runner.temp }}
      env:
        HF_HUB_OFFLINE: '1'
        TRANSFORMERS_OFFLINE: '1'
      run: |
        "$RUNNER_TEMP/versa-wheel-env/bin/python" -I "$GITHUB_WORKSPACE/ci/check_installed_wheel.py"

  core-tests:
    needs: install-tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
        
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[test]
        
    - name: Run core and mocked pipeline tests
      env:
        HF_HUB_OFFLINE: '1'
        TRANSFORMERS_OFFLINE: '1'
        VERSA_RUN_REAL_MODEL_TESTS: '0'
      run: |
        python -m pytest -c ci/pytest-core.ini --rootdir=. -q --junitxml=core-results.xml
        python ci/check_test_report.py core-results.xml

    - name: Preserve core test results
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: core-test-results
        path: core-results.xml
        if-no-files-found: error
