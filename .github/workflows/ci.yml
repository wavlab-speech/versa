name: VERSA CI
on:
  push:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  docstring-coverage:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'

    - name: Install static documentation checkers
      run: python -m pip install -r ci/requirements-docstrings.txt

    - name: Interrogate package docstrings
      run: interrogate --verbose --verbose --fail-under 80 versa

    - name: Cross-check package docstrings
      if: ${{ !cancelled() }}
      run: docstr-coverage --include-setter --include-deleter --fail-under 80 versa

    - name: Check function-only docstrings
      if: ${{ !cancelled() }}
      run: python ci/check_function_docstrings.py --fail-under 80 versa

  code-quality:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Match the formatter revision in .pre-commit-config.yaml.
        pip install -e .[dev] black==25.1.0
        
    - name: Check formatting
      run: |
        git ls-files '*.py' | xargs black --check
      
    - name: Lint with flake8
      run: |
        flake8 versa scripts test setup.py --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 versa scripts test setup.py --count --exit-zero --max-line-length=127 --statistics

  install-tests:
    needs: code-quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']
    
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
        
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        pip install -e .
        
    - name: Test installation
      run: |
        python -c "import versa; print(versa.__version__)"

  core-tests:
    needs: install-tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
        
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[test]
        
    - name: Run core tests
      run: |
        pytest -q test/test_metrics/test_definition.py test/test_docstring_check.py test/test_slurm_launcher.py
