name: Package validation

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install packaging tools
        run: python -m pip install build twine packaging pytest
      - name: Test metadata guard
        run: python -m pytest -q test/test_package_metadata.py
      - name: Build sdist and wheel from sdist
        run: python -m build
      - name: Validate distribution metadata
        run: |
          python -m twine check --strict dist/*
          python ci/check_package_metadata.py dist/*
