name: Optional WavLM model smoke

on:
  workflow_dispatch:
    inputs:
      model_revision:
        description: Full commit SHA for microsoft/wavlm-base-sv
        required: true
        type: string

permissions:
  contents: read

jobs:
  wavlm-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: '3.10'

    - name: Install the base package and selected backend
      run: |
        python -m pip install --upgrade pip
        python -m pip install '.[test]' 'transformers>=4.36.2,<5'

    - name: Prepare pinned model assets and provenance
      env:
        MODEL_REVISION: ${{ inputs.model_revision }}
      run: |
        python ci/prepare_wavlm_smoke.py --revision "$MODEL_REVISION" --cache-dir "$RUNNER_TEMP/wavlm-cache" --manifest model-manifest.json
        python - <<'PY'
        import json
        import os
        from pathlib import Path
        manifest = json.loads(Path("model-manifest.json").read_text())
        with open(os.environ["GITHUB_ENV"], "a") as handle:
            handle.write("VERSA_WAVLM_MODEL_PATH=" + manifest["snapshot_path"] + "\n")
        PY
        python -m pip freeze > model-environment.txt

    - name: Run real inference using only prepared assets
      env:
        VERSA_RUN_REAL_MODEL_TESTS: '1'
        HF_HUB_OFFLINE: '1'
        TRANSFORMERS_OFFLINE: '1'
      run: |
        python -m pytest -q --strict-markers test/test_pipeline/test_speaker_wavlm.py --junitxml=real-model-results.xml
        python ci/check_test_report.py real-model-results.xml

    - name: Preserve model identity, environment, and results
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: wavlm-real-model-evidence
        path: |
          model-manifest.json
          model-environment.txt
          real-model-results.xml
        if-no-files-found: warn
