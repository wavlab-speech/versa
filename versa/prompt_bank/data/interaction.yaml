# Interaction protocols. These are experimental qualitative assessments made
# from one recording without event timestamps.
schema_version: 1
protocols:
  - id: interaction.turn_taking.v1
    version: 1
    title: Turn-taking smoothness in a conversation recording
    status: experimental
    domain: interaction
    task: turn_taking_assessment
    description: >-
      Give a qualitative assessment of conversational turn-taking heard in one
      recording. Without event timestamps this is not a measurement of response
      latency or of interruption counts.
    input_contract:
      audio_inputs: 1
      requires_target_instruction: false
      requires_reference_audio: false
      requires_reference_text: false
    response_contract:
      mode: json
      fields:
        score: {type: integer, minimum: 1, maximum: 5, required: true}
        evidence: {type: array, items: string, required: true}
        disruptions: {type: array, items: string, required: true}
        confidence: {type: number, minimum: 0, maximum: 1, required: true}
        abstain: {type: boolean, required: true}
      primary_numeric_field: score
      output_key: prompt_interaction_turn_taking
    protocol:
      zero_shot: |
        Listen to the recording and assess how smoothly the participants take turns.

        Rate smoothness from 1 to 5:
        - 5: turns follow each other without awkward silence or interruption
        - 4: one awkward transition, otherwise smooth
        - 3: several long gaps or interruptions that disturb the exchange
        - 2: frequent interruptions or long silences between turns
        - 1: participants talk over each other or fail to respond

        Judge only what is audible in this recording. List in evidence the audible observations behind the rating, and in disruptions each audible interruption, long silence, or unanswered turn. Do not estimate response times in seconds and do not judge the content of the conversation. Set abstain to true when the recording has fewer than two speakers or is otherwise not a conversation; then use score 1, confidence 0, and leave both lists empty.
    provenance:
      sources:
        - https://github.com/wavlab-speech/versa
      rationale: >-
        A small bridge towards voice-agent evaluation that stays inside the
        one-audio contract. Validated interaction timing needs event or
        timestamp evidence that this protocol does not collect.
    model_compatibility:
      - family: qwen2_audio

        status: expected
      - family: qwen2_5_omni

        status: expected
    runner_compatibility:
      - runner: qwen2_audio

        status: planned
        modes: [zero_shot]
      - runner: qwen_omni

        status: planned
        modes: [zero_shot]
    metric_links:
      - metric: vad

        role: diagnostic
