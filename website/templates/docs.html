<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}} — VERSA documentation</title>
  <meta name="description" content="{{description}}">
  <meta name="theme-color" content="#153dce">
  <link rel="icon" type="image/png" href="{{root}}assets/versa-icon.png">
  <link rel="stylesheet" href="{{root}}styles.css">
  <link rel="stylesheet" href="{{root}}docs.css">
</head>
<body class="docs-page">
  <a class="skip" href="#main">Skip to content</a>
  <header class="header wrap">
    <a class="wordmark" href="{{root}}" aria-label="VERSA home"><img class="brand-icon" src="{{root}}assets/versa-icon.png" width="48" height="48" alt=""> VERSA</a>
    <nav aria-label="Main navigation"><a href="{{root}}">Home</a><a href="{{root}}docs/" aria-current="true">Docs</a><a class="github" href="https://github.com/wavlab-speech/versa">Source code ↗</a></nav>
  </header>
  <div class="docs-layout wrap">
    <aside class="docs-sidebar"><p class="sidebar-label">DOCUMENTATION</p><nav aria-label="Documentation">{{navigation}}</nav></aside>
    <main id="main" class="doc-main">
      <div class="breadcrumbs"><a href="{{root}}">VERSA</a><span aria-hidden="true">/</span><a href="{{root}}docs/">Docs</a></div>
      <h1>{{title}}</h1>
      <p class="doc-description">{{description}}</p>
      <details class="page-contents"><summary>On this page</summary>{{toc}}</details>
      <article class="prose">{{content}}</article>
      <nav class="doc-pagination" aria-label="Adjacent documentation pages">{{pagination}}</nav>
    </main>
  </div>
  <footer class="wrap"><a class="wordmark" href="{{root}}"><img class="brand-icon" src="{{root}}assets/versa-icon.png" width="48" height="48" alt=""> VERSA</a><div><p>Versatile Evaluation of Speech and Audio</p><a href="{{root}}docs/contributing/">Contribute</a><a href="{{root}}docs/license/">License</a></div></footer>
</body>
</html>
